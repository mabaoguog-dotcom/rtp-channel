name: Configure Telegram Mini App menu

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtp-channel
  cancel-in-progress: false

jobs:
  menu:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set and verify Mini App menu
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python setup_miniapp.py
      - name: Install chat image dependencies
        run: python -m pip install -r requirements.txt
      - name: Reply to pending private start commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python start_handler.py
